# fly.toml app configuration file generated for corolla-retreat on 2026-10-23T22:57:16-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'corolla-retreat'
primary_region = 'lax'

[build]
  image = 'ghcr.io/sebadob/rauthy:0.37.2'

[env]
  MALLOC_CONF = 'abort_conf:true,narenas:1,tcache_max:1024,dirty_decay_ms:1000,muzzy_decay_ms:1000'

[[mounts]]
  source = 'rauthy_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

[[files]]
  guest_path = '/app/config.toml'
  local_path = 'config.toml'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
